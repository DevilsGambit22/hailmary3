name: Manage ACFA Dashboard

on:
  workflow_dispatch:
    inputs:

      action:
        description: "What do you want to update?"
        required: true
        type: choice
        options:
          - tournament
          - staff
          - champions
          - announcements
          - active_members

      # =====================================================
      # TOURNAMENT
      # =====================================================

      tournament_name:
        description: "Tournament name"
        required: false
        type: string

      tournament_url:
        description: "Tournament URL"
        required: false
        type: string

      tournament_button:
        description: "Tournament button text"
        required: false
        type: string

      # =====================================================
      # STAFF
      # =====================================================

      username:
        description: "Chess.com username"
        required: false
        type: string

      role:
        description: "Staff role"
        required: false
        type: string

      staff_action:
        description: "Staff action"
        required: false
        type: choice
        options:
          - add
          - remove

      # =====================================================
      # CHAMPIONS
      # =====================================================

      champion_first:
        description: "1st Place username"
        required: false
        type: string

      champion_second:
        description: "2nd Place username"
        required: false
        type: string

      champion_third:
        description: "3rd Place username"
        required: false
        type: string

      # =====================================================
      # ANNOUNCEMENTS
      # =====================================================

      announcement_title:
        description: "Announcement title"
        required: false
        type: string

      announcement_message:
        description: "Announcement message"
        required: false
        type: string

      # =====================================================
      # ACTIVE MEMBERS
      # =====================================================

      active_member_1:
        description: "Active Member #1"
        required: false
        type: string

      active_member_2:
        description: "Active Member #2"
        required: false
        type: string

      active_member_3:
        description: "Active Member #3"
        required: false
        type: string


permissions:
  contents: write


jobs:

  manage-dashboard:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # ENSURE GENERATED DIRECTORY EXISTS
      # =====================================================

      - name: Prepare generated directory
        run: |
          mkdir -p generated


      # =====================================================
      # TOURNAMENT
      # =====================================================

      - name: Update tournament
        if: ${{ inputs.action == 'tournament' }}
        env:
          NAME: ${{ inputs.tournament_name }}
          URL: ${{ inputs.tournament_url }}
          BUTTON: ${{ inputs.tournament_button }}
        run: |

          jq -n \
            --arg name "$NAME" \
            --arg url "$URL" \
            --arg button "$BUTTON" \
            '[
              {
                name: $name,
                url: $url,
                button: (
                  if $button == ""
                  then $name
                  else $button
                  end
                ),
                active: true
              }
            ]' > generated/tournaments.json


      # =====================================================
      # STAFF
      # =====================================================

      - name: Update staff
        if: ${{ inputs.action == 'staff' }}
        env:
          USERNAME: ${{ inputs.username }}
          ROLE: ${{ inputs.role }}
          STAFF_ACTION: ${{ inputs.staff_action }}
        run: |

          if [ ! -f generated/staff.json ]; then
            echo '[]' > generated/staff.json
          fi

          if [ "$STAFF_ACTION" = "remove" ]; then

            jq \
              --arg username "$USERNAME" \
              '[
                .[] |
                select(
                  (.username | ascii_downcase) !=
                  ($username | ascii_downcase)
                )
              ]' \
              generated/staff.json \
              > generated/staff.tmp

          else

            jq \
              --arg username "$USERNAME" \
              --arg role "$ROLE" \
              '
              [
                .[] |
                select(
                  (.username | ascii_downcase) !=
                  ($username | ascii_downcase)
                )
              ]
              +
              [
                {
                  username: $username,
                  role: $role,
                  order: (
                    length + 1
                  )
                }
              ]
              ' \
              generated/staff.json \
              > generated/staff.tmp

          fi

          mv \
            generated/staff.tmp \
            generated/staff.json


      # =====================================================
      # CHAMPIONS
      # =====================================================

      - name: Update champions
        if: ${{ inputs.action == 'champions' }}
        env:
          FIRST: ${{ inputs.champion_first }}
          SECOND: ${{ inputs.champion_second }}
          THIRD: ${{ inputs.champion_third }}
        run: |

          jq -n \
            --arg first "$FIRST" \
            --arg second "$SECOND" \
            --arg third "$THIRD" \
            '{
              "fall-2026": {
                first: $first,
                second: $second,
                third: $third
              }
            }' > generated/champions.json


      # =====================================================
      # ANNOUNCEMENTS
      # =====================================================

      - name: Update announcements
        if: ${{ inputs.action == 'announcements' }}
        env:
          TITLE: ${{ inputs.announcement_title }}
          MESSAGE: ${{ inputs.announcement_message }}
        run: |

          jq -n \
            --arg title "$TITLE" \
            --arg message "$MESSAGE" \
            '{
              title: $title,
              message: $message
            }' > generated/announcements.json


      # =====================================================
      # ACTIVE MEMBERS
      # =====================================================

      - name: Update active members
        if: ${{ inputs.action == 'active_members' }}
        env:
          MEMBER1: ${{ inputs.active_member_1 }}
          MEMBER2: ${{ inputs.active_member_2 }}
          MEMBER3: ${{ inputs.active_member_3 }}
        run: |

          jq -n \
            --arg member1 "$MEMBER1" \
            --arg member2 "$MEMBER2" \
            --arg member3 "$MEMBER3" \
            '{
              members: [
                $member1,
                $member2,
                $member3
              ]
              | map(
                  select(
                    length > 0
                  )
                )
            }' > generated/active-members.json


      # =====================================================
      # COMMIT CHANGES
      # =====================================================

      - name: Commit dashboard changes
        run: |

          git config \
            user.name \
            "ACFA Dashboard Bot"

          git config \
            user.email \
            "actions@github.com"

          git add generated/

          if git diff --cached --quiet; then

            echo "No dashboard changes detected."

            exit 0

          fi

          git commit \
            -m "Update ACFA dashboard: ${{ inputs.action }}"

          git push