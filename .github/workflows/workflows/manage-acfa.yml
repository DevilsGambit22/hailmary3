name: Manage ACFA Dashboard

on:
  workflow_dispatch:
    inputs:

      section:
        description: "What do you want to update?"
        required: true
        type: choice
        options:
          - tournament
          - staff
          - champions
          - active_members

      operation:
        description: "Add/update or remove?"
        required: true
        type: choice
        options:
          - add
          - remove

      id:
        description: "Tournament ID"
        required: false
        type: string

      title:
        description: "Tournament name"
        required: false
        type: string

      url:
        description: "Tournament URL"
        required: false
        type: string

      button:
        description: "Tournament button text"
        required: false
        type: string

      username:
        description: "Chess.com username"
        required: false
        type: string

      role:
        description: "Staff role"
        required: false
        type: string

      order:
        description: "Staff display order"
        required: false
        default: "999"
        type: string

      place:
        description: "Champion placement"
        required: false
        type: choice
        options:
          - first
          - second
          - third

      member1:
        description: "Active Member #1 Chess.com username"
        required: false
        type: string

      member2:
        description: "Active Member #2 Chess.com username"
        required: false
        type: string

      member3:
        description: "Active Member #3 Chess.com username"
        required: false
        type: string

permissions:
  contents: write

jobs:

  update-dashboard:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update dashboard JSON
        env:

          SECTION: ${{ inputs.section }}
          OPERATION: ${{ inputs.operation }}

          ID: ${{ inputs.id }}
          TITLE: ${{ inputs.title }}
          URL: ${{ inputs.url }}
          BUTTON: ${{ inputs.button }}

          USERNAME: ${{ inputs.username }}
          ROLE: ${{ inputs.role }}
          ORDER: ${{ inputs.order }}

          PLACE: ${{ inputs.place }}

          MEMBER1: ${{ inputs.member1 }}
          MEMBER2: ${{ inputs.member2 }}
          MEMBER3: ${{ inputs.member3 }}

        run: |

          python <<'PY'

          import json
          import os
          from pathlib import Path

          generated = Path("generated")

          generated.mkdir(
              exist_ok=True
          )

          section = os.environ["SECTION"]
          operation = os.environ["OPERATION"]


          if section == "tournament":

              path = generated / "tournaments.json"

              if path.exists():
                  data = json.loads(path.read_text())
              else:
                  data = []

              tournament_id = (
                  os.environ
                  .get("ID","")
                  .strip()
              )

              if operation == "remove":

                  data = [
                      item
                      for item in data
                      if item.get("id") != tournament_id
                  ]

              else:

                  record = {
                      "id": tournament_id,
                      "name": os.environ.get("TITLE","").strip(),
                      "button": os.environ.get("BUTTON","").strip(),
                      "url": os.environ.get("URL","").strip(),
                      "active": True
                  }

                  replaced = False

                  for i,item in enumerate(data):

                      if item.get("id") == tournament_id:

                          data[i] = record
                          replaced = True
                          break

                  if not replaced:
                      data.append(record)

              path.write_text(
                  json.dumps(
                      data,
                      indent=2
                  )
              )


          elif section == "staff":

              path = generated / "staff.json"

              if path.exists():
                  data = json.loads(path.read_text())
              else:
                  data = []

              username = (
                  os.environ
                  .get("USERNAME","")
                  .strip()
              )

              if operation == "remove":

                  data = [
                      member
                      for member in data
                      if member.get("username","").lower()
                      != username.lower()
                  ]

              else:

                  try:
                      order = int(
                          os.environ.get(
                              "ORDER",
                              "999"
                          )
                      )
                  except:
                      order = 999

                  record = {
                      "username": username,
                      "role": os.environ.get("ROLE","").strip(),
                      "order": order
                  }

                  replaced = False

                  for i,member in enumerate(data):

                      if member.get("username","").lower() == username.lower():

                          data[i] = record
                          replaced = True
                          break

                  if not replaced:
                      data.append(record)

              data.sort(
                  key=lambda x:
                  x.get("order",999)
              )

              path.write_text(
                  json.dumps(
                      data,
                      indent=2
                  )
              )


          elif section == "champions":

              path = generated / "champions.json"

              if path.exists():
                  data = json.loads(path.read_text())
              else:
                  data = {
                      "first":"",
                      "second":"",
                      "third":""
                  }

              place = (
                  os.environ
                  .get("PLACE","")
                  .strip()
              )

              username = (
                  os.environ
                  .get("USERNAME","")
                  .strip()
              )

              if place not in [
                  "first",
                  "second",
                  "third"
              ]:
                  raise SystemExit(
                      "Invalid champion place"
                  )

              if operation == "remove":
                  data[place] = ""
              else:
                  data[place] = username

              path.write_text(
                  json.dumps(
                      data,
                      indent=2
                  )
              )


          elif section == "active_members":

              path = generated / "active-members.json"

              members = [
                  os.environ.get("MEMBER1", "").strip(),
                  os.environ.get("MEMBER2", "").strip(),
                  os.environ.get("MEMBER3", "").strip(),
              ]

              data = {
                  "members": members
              }

              path.write_text(
                  json.dumps(
                      data,
                      indent=2
                  )
              )

          PY

      - name: Commit changes
        run: |

          git config user.name "ACFA Dashboard Bot"

          git config user.email "actions@users.noreply.github.com"

          git add generated/

          if git diff --cached --quiet
          then
            echo "No changes."
          else
            git commit -m "Update ACFA dashboard data"
            git push
          fi